
<%@ page contentType="text/html;charset=UTF-8" language="java" %>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Login | Anomaly Detection</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #101b35, #243b65);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        .login-icon {
            width: 70px;
            height: 70px;
            background: #e8efff;
            color: #172b4d;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 15px;
        }

        .login-card h3 {
            text-align: center;
            margin-bottom: 8px;
            color: #172b4d;
            font-weight: bold;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-label {
            color: #172b4d;
            font-weight: 600;
        }

        .form-control {
            padding: 11px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,.12);
        }

        .btn-admin {
            background: #172b4d;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            border: none;
        }

        .btn-admin:hover {
            background: #294b7a;
            color: white;
        }

        .back-home-btn {
            display: inline-block;
            background: #e8efff;
            color: #172554;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-home-btn:hover {
            background: #2563eb;
            color: white;
        }

        .login-footer {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <!-- Login Icon -->
    <div class="login-icon">
        &#128100;
    </div>

    <h3>Admin Login</h3>

    <p class="login-subtitle">
        Automated Anomaly Detection System
    </p>

    <!-- Error Message -->
    <% if (request.getAttribute("error") != null) { %>
        <div class="alert alert-danger text-center">
            <%= request.getAttribute("error") %>
        </div>
    <% } %>

    <!-- Back to Home -->
    <div class="mb-4">
        <a href="${pageContext.request.contextPath}/"
           class="back-home-btn">
            &#8592; Back to Home
        </a>
    </div>

    <!-- Admin Login Form -->
    <form action="${pageContext.request.contextPath}/admin-login"
          method="post">

        <div class="mb-3">
            <label class="form-label">Admin Username</label>

            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Enter admin username"
                   autocomplete="username"
                   required>
        </div>

        <div class="mb-4">
            <label class="form-label">Admin Password</label>

            <input type="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter admin password"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="btn btn-admin">
            Login
        </button>

    </form>

    <div class="login-footer">
        Admin Access Only
    </div>

</div>

</body>
</html>
